[package]
name = "walle"
version = "0.5.0"
authors = ["Sonny Scroggin"]
edition = "2021"

[lib]
name = "walle"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
alloy = { version = "0.12", features = [
    "eip712",
    "reqwest-rustls-tls",
    "signers",
    "signer-keystore",
    "signer-local",
    "signer-mnemonic",
], default-features = false }
once_cell = "1.19"
rand = "0.8"
rustler = "0.35"
serde_json = "1.0"
tempfile = "3.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
